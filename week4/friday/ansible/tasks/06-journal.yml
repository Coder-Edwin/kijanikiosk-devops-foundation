---
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# A drop-in, not an edit of the distro's journald.conf, so package upgrades
# never overwrite it.
- name: Make the journal persistent and size-capped
  ansible.builtin.template:
    src: templates/journald-kijanikiosk.conf.j2
    dest: /etc/systemd/journald.conf.d/kijanikiosk.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
