---
# Layout (Week 3):
#   /opt/kijanikiosk                root:kijanikiosk      0750
#   /opt/kijanikiosk/config         root:kijanikiosk      0750
#   /opt/kijanikiosk/<svc>          root:kk-<svc>         0750
#   /opt/kijanikiosk/<svc>/app      root:kk-<svc>         0750  (code: read-only to the service)
#   /opt/kijanikiosk/<svc>/data     kk-<svc>:kk-<svc>     0750  (the only place it may write)
#   /var/log/kijanikiosk            root:kijanikiosk      0750
- name: Create KijaniKiosk directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kk_base_dir }}", owner: root, group: "{{ kk_group }}", mode: "0750" }
    - { path: "{{ kk_config_dir }}", owner: root, group: "{{ kk_group }}", mode: "0750" }
    - { path: "{{ service_root_dir }}", owner: root, group: "{{ service_user }}", mode: "0750" }
    - { path: "{{ service_app_dir }}", owner: root, group: "{{ service_user }}", mode: "0750" }
    - { path: "{{ service_data_dir }}", owner: "{{ service_user }}", group: "{{ service_user }}", mode: "0750" }
    - { path: "{{ kk_log_dir }}", owner: root, group: "{{ kk_group }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Deploy the service's environment file (readable by the service account only)
  ansible.builtin.template:
    src: templates/service.env.j2
    dest: "{{ kk_config_dir }}/{{ service_env_file }}"
    owner: root
    group: "{{ service_user }}"
    mode: "0640"
  notify: Restart kk service

- name: Deploy the service's landing page
  ansible.builtin.template:
    src: templates/index.html.j2
    dest: "{{ service_app_dir }}/index.html"
    owner: root
    group: "{{ service_user }}"
    mode: "0640"
