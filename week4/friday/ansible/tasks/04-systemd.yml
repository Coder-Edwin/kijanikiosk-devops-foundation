---
- name: Install the hardened systemd unit
  ansible.builtin.template:
    src: templates/kk-service.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kk service

# daemon_reload here (not only in the handler) so a brand-new unit is known to
# systemd before we try to enable it on the first run.
- name: Enable and start the service
  ansible.builtin.systemd_service:
    name: "{{ service_name }}"
    enabled: true
    state: started
    daemon_reload: true
