[defaults]
inventory = inventory.ini
# Remote user and private key live in group_vars/kijanikiosk.yml, not here,
# so the key path has one home that pipeline.sh can also read.
forks = 3
gathering = smart
retry_files_enabled = False
nocows = True
stdout_callback = default
# Show tasks that were skipped/ok as well, so the logs prove what ran.
display_skipped_hosts = True

[ssh_connection]
# accept-new: trust a brand-new server's host key on first contact, but refuse
# to connect if a known server's key ever changes. Safer than the lab's
# host_key_checking = False, and still works on freshly created servers.
# A separate known_hosts file stops recreated servers (new key, recycled IP)
# from clashing with entries in your personal ~/.ssh/known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.ansible_known_hosts
pipelining = True
